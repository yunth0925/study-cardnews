<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>대구대학교 문헌정보학과 카드뉴스</title>
  <meta name="description" content="검색창으로 알아보는 대구대학교 문헌정보학과 — 고등학생을 위한 학과 소개 카드뉴스">
  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- 큰 제목용 명조 글꼴: 고운바탕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="viewer" aria-roledescription="카드뉴스" aria-label="대구대학교 문헌정보학과 카드뉴스">
    <!-- 카드가 놓이는 자리 -->
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
    </div>

    <!-- 아래 조작 줄: 이전 / 진행 표시 / 다음 -->
    <nav class="controls" aria-label="카드 넘기기">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="이전 카드">&#8592;</button>
      <div class="progress">
        <div class="progress-bar"><span id="progressFill"></span></div>
        <span class="progress-text" id="progressText" aria-live="polite"></span>
      </div>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="다음 카드">&#8594;</button>
    </nav>

    <!-- 카드 아래 버튼: 처음으로 / PDF 저장 -->
    <div class="extra-actions">
      <button class="action-btn" id="homeBtn" type="button">&#8634; 처음으로</button>
      <button class="action-btn primary" id="pdfBtn" type="button">&#8681; PDF 저장</button>
    </div>
  </main>

  <!-- 카드 내용 데이터 → 화면 그리기 순서로 불러와요 -->
  <script src="js/cards.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
